# ─────────────────────────────────────────────────────────────────────
#  Загальні налаштування бота (діють для всіх закладів)
# ─────────────────────────────────────────────────────────────────────

# Який AI використовувати: "anthropic" (Claude, платно) або "gemini" (Google, є безкоштовний рівень для тестів).
provider = "gemini"

# Ключ Gemini API (лише для provider = "gemini"): https://aistudio.google.com → Get API key.
# Можна не писати сюди, а задати змінну середовища GEMINI_API_KEY.
# Увага: на безкоштовному рівні Google може використовувати листування для покращення своїх продуктів —
# для тестів підходить, для реальних клієнтів закладу краще Claude або платний рівень Gemini.
gemini_api_key = ""

# Модель Gemini. Flash — швидка і доступна на безкоштовному рівні.
# Перелік моделей: https://ai.google.dev/gemini-api/docs/models
gemini_model = "gemini-3.5-flash"

# Ключ Anthropic API: https://console.anthropic.com → Settings → API Keys.
# Починається з «sk-ant-». Без ключа бот працює лише на кнопках, без AI-відповідей.
# Можна не писати сюди, а задати змінну середовища ANTHROPIC_API_KEY.
anthropic_api_key = ""

# Модель AI. claude-haiku-5-5 — швидка й дешева, для барбершопу її достатньо.
# Для складніших діалогів можна поставити claude-sonnet-5-5 (приблизно в 20 разів дорожче).
model = "claude-haiku-5-5"

# Наскільки ретельно модель «думає» перед відповіддю: low / medium / high.
# low — найшвидше і найдешевше, для запису на послуги цього вистачає.
# Порожнє значення "" — не передавати цей параметр (для старіших моделей, які його не знають).
effort = "low"

# Захист від перевитрат: скільки токенів AI на день може використати ОДИН заклад.
# 2 000 000 токенів — це не більше ≈$1 на день; звичайному барбершопу треба в десятки разів менше.
daily_token_limit = 2000000

# Ціни Haiku 5.5 за 1 млн токенів у доларах (для приблизної вартості в /stats).
# Актуальні ціни: https://platform.claude.com/docs/en/about-claude/pricing
[prices]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

# Ціни Gemini за 1 млн токенів (для /stats, коли provider = "gemini").
# На безкоштовному рівні — нулі. Якщо підключите платний рівень, впишіть ціни з https://ai.google.dev/pricing
[gemini_prices]
input = 0
output = 0
cache_read = 0
cache_write = 0

# Технічні параметри — зазвичай змінювати не потрібно.
[advanced]
thinking = "adaptive"        # adaptive або disabled
max_tokens = 2048            # максимальна довжина однієї відповіді моделі (разом із «роздумами»)
max_tool_rounds = 6          # скільки разів підряд модель може звертатися до інструментів
history_messages = 24        # скільки останніх повідомлень діалогу пам'ятає AI
history_hours = 24           # і не старших за стільки годин
data_dir = "data"            # де зберігати базу даних і журнали
log_level = "INFO"
