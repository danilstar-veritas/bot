# ─────────────────────────────────────────────────────────────────────
#  Налаштування ОДНОГО закладу (бізнес-клієнта).
#  Для нового клієнта скопіюйте цей файл під іншою назвою латиницею,
#  наприклад config/tenants/brutal-barber.toml, і змініть дані.
#
#  Правила формату: текст — у прямих лапках "...", числа й true/false — без лапок.
#  Рядок після # — коментар, бот його ігнорує.
# ─────────────────────────────────────────────────────────────────────

# false — тимчасово вимкнути заклад, не видаляючи файл (наприклад, клієнт не оплатив).
enabled = true

# Назва закладу — бот так представляється клієнтам.
name = "Barbershop «Бритва»"

# Токен бота від @BotFather у Telegram (виглядає як 1234567890:AAH...).
# Кожному закладу — окремий бот і окремий токен.
bot_token = "ВСТАВТЕ_ТОКЕН_ВІД_BOTFATHER"

# Telegram ID власника/адміністраторів: їм приходять нові записи, скарги, питання клієнтів.
# Щоб дізнатися свій ID — запустіть бота і напишіть йому /myid. Кілька ID: [111, 222]
admins = []

# (необов'язково) Ваш власний ID як розробника — сюди приходять технічні сповіщення
# («AI не відповідає», «закінчився ліміт»). Якщо порожньо — їх отримують admins.
tech_admins = []

# Часовий пояс закладу: Europe/Kyiv, Europe/Budapest, Europe/Warsaw, Europe/Berlin…
timezone = "Europe/Kyiv"

# Мови кнопок і меню: uk, ru, en. Перша — основна (нею пишуться повідомлення власнику).
# Клієнт бачить кнопки мовою свого Telegram, якщо вона є в списку. AI відповідає мовою клієнта.
languages = ["uk", "ru", "en"]

# Як показувати ціну: "{price} грн", "{price} Ft", "€{price}", "{price} zł"
price_format = "{price} грн"


[info]
address = "м. Київ, вул. Хрещатик, 1"
phone = "+380 67 000 00 00"
maps_url = "https://maps.google.com/?q=Хрещатик+1+Київ"
directions = "Вхід з двору, поруч безкоштовна парковка."
payment = "Готівка, картка, Apple Pay / Google Pay. Передоплата не потрібна."
# Графік текстом. Якщо порожньо — бот складе його сам із графіків майстрів.
hours = ""
# Будь-які факти, які AI може розповідати клієнтам. Чого тут немає — AI не вигадає,
# а передасть питання вам.
extra = """
Поки чекаєте — кава, чай і PlayStation безкоштовно.
Дітей до 12 років стрижемо лише в присутності батьків.
Подарункові сертифікати можна купити в закладі (номінал від 500 грн).
Укладання входить у вартість стрижки. Миття голови — окремо, 150 грн (можна додати під час запису).
"""
# Як підписуються ваші відповіді клієнтам (за замовчуванням «Адміністратор»).
admin_title = ""


[booking]
slot_step_min = 30           # крок часу для запису: 15, 20, 30, 60 хв
days_ahead = 14              # на скільки днів уперед можна записатися
min_lead_min = 60            # не пізніше ніж за стільки хвилин до початку
buffer_min = 0               # перерва між клієнтами, хв (прибирання, кава)
require_phone = true         # просити номер телефону перед підтвердженням запису
max_active_per_client = 2    # скільки майбутніх записів може мати один клієнт
cancel_min_hours = 2         # скасувати/перенести онлайн — не пізніше ніж за N год (0 — будь-коли)
holidays = ["2026-12-31", "2027-01-01"]   # дні, коли заклад зачинено


[reminders]
hours_before = [24, 2]       # нагадування клієнту за 24 год і за 2 год до візиту ([] — вимкнути)


[repeat_visit]
enabled = true               # через N днів після візиту запропонувати записатися знову
after_days = 28
send_at = "11:00"


[notifications]
new_bookings = true          # повідомляти власника про кожен новий запис
digest_at = "09:00"          # о котрій надсилати власнику розклад на день ("" — вимкнути)


[ai]
enabled = true
address_form = "ви"          # як AI звертається до клієнтів: "ви" або "ти"
handoff_pause_hours = 12     # після передачі розмови власнику AI мовчить для цього клієнта N годин
max_messages_per_hour = 20   # захист від спаму: скільки повідомлень AI обробить від одного клієнта
max_messages_per_day = 60
# Побажання до стилю спілкування (необов'язково):
extra_instructions = """
"""


# Графік роботи за замовчуванням для всіх майстрів.
# Формат: "10:00-19:00", з перервою: "10:00-14:00, 15:00-19:00", вихідний: "off".
[schedule]
mon = "10:00-20:00"
tue = "10:00-20:00"
wed = "10:00-20:00"
thu = "10:00-20:00"
fri = "10:00-20:00"
sat = "10:00-18:00"
sun = "off"


