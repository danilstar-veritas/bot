[[masters]]
id = "bence"
name = "Bence"
name_uk = "Бенце"
services = ["haircut", "beard", "combo", "kids_boy", "kids_buzz", "buzz", "wash"]
about = "Egyszer a Mosoni-Dunánál, csónakban ülve nyírta ki magát úgy, hogy egyetlen felesleges hajszálat sem vágott le. Azóta minden fade számára meditáció, a tökéletes átmenet pedig becsületbeli ügy. A kávé nála csak fekete, a zene csak bakelitről szól."
about_uk = "Якось підстриг себе сам, сидячи в човні на Мошонському Дунаї, — і не зрізав жодної зайвої волосини. Відтоді кожен фейд для нього — медитація, а ідеальний перехід — справа честі. Кава — тільки чорна, музика — тільки з вінілу."
about_en = "He once cut his own hair sitting in a boat on the Moson Danube — without losing a single extra hair. Since then every fade is meditation for him, and a perfect blend is a matter of honour. Coffee only black, music only on vinyl."
about_de = "Einmal hat er sich in einem Boot auf der Mosoni-Donau selbst die Haare geschnitten — ohne ein einziges Haar zu viel. Seitdem ist jeder Fade für ihn Meditation und ein perfekter Übergang Ehrensache. Kaffee nur schwarz, Musik nur von Vinyl."

[[masters]]
id = "mate"
name = "Máté"
name_uk = "Мате"
services = ["haircut", "beard", "combo", "kids_boy", "kids_buzz", "buzz", "wash"]
about = "A szakállat külön művészeti ágnak tartja. Mondják, egyszer olyan egyenesre igazította egy vendég szakállát, hogy az rögtön elment útlevélképet csináltatni. Hétfőn nem dolgozik: ollót élez, és Krúdyt olvas újra."
about_uk = "Вважає бороду окремим видом мистецтва. Кажуть, якось він так рівно підрівняв клієнту бороду, що той одразу пішов фотографуватися на паспорт. По понеділках не працює: гострить ножиці й перечитує Круді."
about_en = "Considers the beard an art form of its own. They say he once trimmed a client's beard so straight that the client went right off to have a passport photo taken. He doesn't work on Mondays: he sharpens scissors and rereads Krúdy."
about_de = "Hält den Bart für eine eigene Kunstform. Man erzählt, er habe einem Kunden den Bart einmal so gerade gestutzt, dass dieser sofort ein Passfoto machen ließ. Montags arbeitet er nicht: Er schärft Scheren und liest Krúdy."
