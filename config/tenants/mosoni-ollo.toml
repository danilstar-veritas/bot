# ─────────────────────────────────────────────────────────────────────
#  Угорська версія закладу: «Mosoni Olló Stúdió», Мошонмадяровар.
#  Основна мова — угорська; клієнтам також українська, англійська й німецька (усе перекладено).
#  Правила формату — як у demo-barbershop.toml.
#  Щоб запустити: вставте токен нового бота від @BotFather і свій Telegram ID в admins.
# ─────────────────────────────────────────────────────────────────────

enabled = true

name = "Mosoni Olló Stúdió"

bot_token = "ВСТАВТЕ_ТОКЕН_ВІД_BOTFATHER"

admins = []
tech_admins = []

timezone = "Europe/Budapest"

# Угорська — основна (нею пишуться повідомлення власнику). Клієнт бачить усе мовою свого Telegram,
# якщо вона є в списку; інші мови — англійською.
languages = ["hu", "uk", "en", "de"]

price_format = "{price} Ft"


[info]
address = "9200 Mosonmagyaróvár, Fő utca 12."
address_uk = "Мошонмадяровар, вул. Фьо, 12 (9200 Mosonmagyaróvár, Fő utca 12.)"
address_en = "Fő utca 12, 9200 Mosonmagyaróvár, Hungary"
address_de = "Fő utca 12, 9200 Mosonmagyaróvár, Ungarn"
phone = "+36 30 000 00 00"
maps_url = "https://maps.google.com/?q=Fő+utca+12+Mosonmagyaróvár"
directions = "A bejárat az udvar felől van, mellette ingyenes parkoló található."
directions_uk = "Вхід з двору, поруч безкоштовна парковка."
directions_en = "The entrance is from the courtyard, with free parking right next to it."
directions_de = "Der Eingang ist im Hof, direkt daneben gibt es kostenlose Parkplätze."
payment = "Készpénz, bankkártya, Apple Pay / Google Pay."
payment_uk = "Готівка, банківська картка, Apple Pay / Google Pay."
payment_en = "Cash, bank card, Apple Pay / Google Pay."
payment_de = "Bargeld, Bankkarte, Apple Pay / Google Pay."
hours = ""
extra = """
Amíg vár: kávé, tea és PlayStation ingyen.
A 12 év alatti gyerekeket csak szülői jelenlétében vágjuk.
Ajándékutalványt a szalonban lehet vásárolni (értéke 5000 Ft-tól).
A hajmosás nem tartozik a hajvágás árába: 1500 Ft (foglaláskor hozzáadható). A beszárítás a hajvágás árában benne van.
"""
admin_title = ""


[booking]
slot_step_min = 30
days_ahead = 14
min_lead_min = 60
buffer_min = 0
require_phone = true
max_active_per_client = 0
max_per_week_per_client = 5
cancel_min_hours = 2
holidays = ["2026-12-24", "2026-12-25", "2026-12-26", "2027-01-01"]


[reminders]
hours_before = [24, 2]


[repeat_visit]
enabled = true
after_days = 28
send_at = "11:00"


[notifications]
new_bookings = true
digest_at = "08:00"
report_at = "20:00"
master_heads_up_min = 15


[prepayment]
# Előleg: kikapcsolva, amíg nincs megadva kártyaszám (card).
enabled = true
amount = 1500
card = ""
recipient = ""
pay_within_hours = 2


[ai]
enabled = true
address_form = "ви"          # ввічлива форма («Ön»)
handoff_pause_hours = 12
max_messages_per_hour = 20
max_messages_per_day = 60
extra_instructions = """
Ügyfelekkel magyarul beszélj, udvariasan, magázódva («Ön»), hacsak az ügyfél nem ír más nyelven —
ukránul, angolul vagy németül az ügyfél nyelvén válaszolj, udvariasan (németül «Sie»).
"""


# ── Instagram / Facebook Messenger (необов'язково) ──────────────────
# Клієнти пишуть у Direct чи Messenger — бот відповідає й записує так само, як у Telegram.
# Як отримати ці значення — README, розділ «Instagram і Facebook». Токен — лише на сервері, не в git.
