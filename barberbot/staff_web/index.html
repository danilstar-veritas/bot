<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Admin</title>
<style>
:root {
  --bg: #181614; --surface: #221f1b; --surface2: #2c2823; --line: #3a352e;
  --text: #f3eee7; --muted: #a59b8e; --gold: #d6aa5c; --gold-ink: #1c1710;
  --red: #e5735c; --green: #74c08f; --blue: #7fb0e0;
  --radius: 14px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f6f2ec; --surface: #ffffff; --surface2: #f0ebe3; --line: #e2dbd0;
          --text: #1f1b16; --muted: #7a7064; --gold: #b8872f; --gold-ink: #ffffff; --red: #c9533c; --green: #3d8f5c; --blue: #3c78b4; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(72px + var(--safe-b)); min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px;
         border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; gap: 8px; }
.shop { font-weight: 700; font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { background: none; border: 0; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; position: relative; }
.iconbtn:active { background: var(--surface2); }
.dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
.datenav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.datenav .label { flex: 1; text-align: center; font-weight: 600; }
.datenav input[type=date] { position: absolute; opacity: 0; pointer-events: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
main { padding: 12px 16px; max-width: 720px; margin: 0 auto; }
.hours { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.bk { display: grid; grid-template-columns: 64px 1fr; gap: 10px; width: 100%; text-align: left; }
.bk .time { font-weight: 700; font-size: 18px; }
.bk .end { color: var(--muted); font-size: 13px; }
.bk .who { font-weight: 600; }
.bk .what { color: var(--muted); font-size: 14px; }
.bk.past { opacity: .55; }
.bk.noshow .who { text-decoration: line-through; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 6px; background: var(--surface2); color: var(--muted); }
.badge.red { color: var(--red); } .badge.green { color: var(--green); } .badge.gold { color: var(--gold); }
.block { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; color: var(--muted); }
.block span { flex: 1; }
.empty { color: var(--muted); text-align: center; padding: 36px 8px; }
.dayhead { margin: 18px 0 8px; font-weight: 700; display: flex; justify-content: space-between; }
.dayhead small { color: var(--muted); font-weight: 400; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--line);
           padding-bottom: var(--safe-b); }
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button b { font-size: 20px; font-weight: 400; line-height: 1.2; }
nav.tabs button.on { color: var(--gold); }
.fab { position: fixed; right: 16px; bottom: calc(84px + var(--safe-b)); z-index: 7; width: 64px; height: 64px; border-radius: 50%;
       border: 0; background: var(--gold); color: var(--gold-ink); font-size: 28px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.fab.rec { background: var(--red); color: #fff; animation: pulse 1.2s infinite; }
.fab.wait { opacity: .7; }
.fab2 { position: fixed; right: 92px; bottom: calc(92px + var(--safe-b)); z-index: 7; width: 48px; height: 48px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--surface); font-size: 24px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,115,92,.6); } 50% { box-shadow: 0 0 0 14px rgba(229,115,92,0); } }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0;
         max-height: 88vh; overflow-y: auto; padding: 8px 16px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .22s ease; }
.sheet.open { transform: none; }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: -6px 0 12px; white-space: pre-line; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px 14px; margin: 8px 0 0; background: var(--surface2); font-weight: 600; text-align: center; }
a.btn { color: var(--text); text-decoration: none; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.red { color: var(--red); }
.btn:disabled { opacity: .5; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input.f, select.f, textarea.f { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; }
textarea.f { min-height: 80px; resize: vertical; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slots .chip { min-width: 64px; text-align: center; }
.summary { white-space: pre-line; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; margin: 4px 0; white-space: pre-wrap; font-size: 15px; }
.bubble.client { background: var(--surface2); }
.bubble.bot { background: var(--bg); border: 1px solid var(--line); margin-left: auto; }
.bubble.admin { background: var(--gold); color: var(--gold-ink); margin-left: auto; }
.bubble small { display: block; opacity: .6; font-size: 11px; }
.chatrow { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; }
.chatrow .nm { font-weight: 600; } .chatrow .lt { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chatrow > div { min-width: 0; flex: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-size: 24px; } .stat span { color: var(--muted); font-size: 13px; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.heard { color: var(--muted); font-style: italic; margin-bottom: 8px; }
.reply { font-size: 18px; margin-bottom: 8px; white-space: pre-line; }
.ask { display: flex; gap: 8px; margin-top: 14px; }
.ask input { flex: 1; }
.ask button { border: 0; border-radius: 10px; background: var(--gold); color: var(--gold-ink); padding: 0 14px; font-weight: 700; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(160px + var(--safe-b)); z-index: 30; background: var(--text); color: var(--bg);
         border-radius: 12px; padding: 12px 14px; text-align: center; display: none; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.steps { padding-left: 20px; color: var(--muted); font-size: 14px; } .steps li { margin: 4px 0; }
.ex { color: var(--muted); font-size: 14px; } .ex li { margin: 3px 0; }
</style>
</head>

      <button class="iconbtn" id="prev">◀</button>
      <button class="iconbtn label" id="datelabel" style="width:auto"></button>
      <input type="date" id="datepick">
      <button class="iconbtn" id="next">▶</button>
    </div>
    <div class="chips" id="masterchips"></div>
  </div>
</header>
<main id="main"></main>
<button class="fab2" id="plus" aria-label="add">＋</button>
<button class="fab" id="mic" aria-label="speak">🎙</button>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>

async function api(path, data, opts = {}) {
  const init = { credentials: "same-origin", headers: { "X-Requested-With": "staff" }, cache: "no-store" };
  if (data !== undefined) {
    init.method = "POST";
    if (data instanceof Blob) { init.body = data; init.headers["Content-Type"] = data.type || "audio/webm"; }
    else { init.body = JSON.stringify(data); init.headers["Content-Type"] = "application/json"; }
  }
  const r = await fetch(BASE + "api/" + path, init);
  if (r.status === 401) { showLoggedOut(); throw new Error("unauthorized"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok && !opts.soft) { toast(body.message || t("error")); throw Object.assign(new Error(body.error || "error"), { body }); }
  return body;
}

function toast(text, ms = 2600) {
  const el = $("toast"); el.textContent = text; el.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (el.style.display = "none"), ms);
}

function showLoggedOut() {
  document.body.innerHTML = `<main style="text-align:center;padding-top:20vh"><p style="font-size:44px">🔒</p>
    <p>Напишіть боту <b>/app</b> — він надішле посилання для входу.</p><p style="opacity:.7">Send <b>/app</b> to the bot to log in.<br>Írja be a botnak: <b>/app</b></p></main>`;
}

// ------------------------------------------------------------------ дати
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const shift = (s, days) => { const d = fromIso(s); d.setDate(d.getDate() + days); return iso(d); };

function renderTabs() {
  const tabs = [["day", "📅", t("today")], ["week", "🗓", t("week")]];
  if (S.me.role === "owner") tabs.push(["chats", "💬", t("chats")]);
  tabs.push(["report", "📊", t("report")], ["more", "⚙️", t("more")]);
  $("tabs").innerHTML = tabs.map(([id, ic, name]) => `<button data-tab="${id}" class="${S.tab === id ? "on" : ""}"><b>${ic}</b>${esc(name)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { S.tab = b.dataset.tab; render(); }));
  $("dateblock").style.display = S.tab === "day" ? "" : "none";
  $("plus").style.display = ["day", "week"].includes(S.tab) ? "" : "none";
}

function renderMasterChips() {
  const box = $("masterchips");
  if (S.me.role !== "owner" || S.me.masters.length < 2) { box.style.display = "none"; return; }
  const items = [["", t("all")], ...S.me.masters.map((m) => [m.id, m.name])];
  box.innerHTML = items.map(([id, name]) => `<button class="chip ${S.master === id ? "on" : ""}" data-m="${esc(id)}">${esc(name)}</button>`).join("");
  box.querySelectorAll("button").forEach((b) => (b.onclick = () => { S.master = b.dataset.m; render(); }));
}

async function render() {
  renderTabs();
  const main = $("main");
  try {
    if (S.tab === "day") await renderDay(main);
    else if (S.tab === "week") await renderWeek(main);
    else if (S.tab === "chats") await renderChats(main);
    else if (S.tab === "report") await renderReport(main);
    else renderMore(main);
  } catch (e) { if (e.message !== "unauthorized") main.innerHTML = `<p class="empty">${esc(t("error"))}</p>`; }
}

// ------------------------------------------------------------------ день
function badges(b) {
  const out = [];
  if (b.status === "no_show") out.push(`<i class="badge red">${esc(t("status_noshow"))}</i>`);
  if (b.source === "ai") out.push(`<i class="badge gold">${esc(t("ai"))}</i>`);
  if (b.source === "admin") out.push(`<i class="badge">${esc(t("phone_book"))}</i>`);
  if (b.confirmed) out.push(`<i class="badge green">${esc(t("confirmed"))}</i>`);
  if (b.prepay && b.prepay !== "paid") out.push(`<i class="badge red">💳 ${esc(b.prepay)}</i>`);
  return out.length ? `<div class="badges">${out.join("")}</div>` : "";
}

function bookingCard(b, showMaster) {
  const cls = ["card", "bk", b.past ? "past" : "", b.status === "no_show" ? "noshow" : ""].join(" ");
  return `<button class="${cls}" data-bk="${b.booking_id}">
    <div><div class="time">${esc(b.time)}</div><div class="end">${esc(b.end)}</div></div>
    <div><div class="who">${esc(b.client)}</div><div class="what">${esc(b.service)}${showMaster ? " · " + esc(b.master) : ""}</div>
    ${b.note ? `<div class="what">📝 ${esc(b.note)}</div>` : ""}${badges(b)}</div></button>`;
}

function blockRow(bl, showMaster) {
  return `<div class="block"><span>🔒 ${esc(bl.range)}${showMaster ? " · " + esc(bl.master) : ""}${bl.note ? " — " + esc(bl.note) : ""}</span>
    ${bl.can_open ? `<button class="chip" data-unblock="${bl.block_id}">${esc(t("open"))}</button>` : ""}</div>`;
}

function bindList(root, bookings) {
  root.querySelectorAll("[data-bk]").forEach((el) => (el.onclick = () => openBooking(bookings.find((b) => b.booking_id === +el.dataset.bk))));
  root.querySelectorAll("[data-unblock]").forEach((el) => (el.onclick = () => propose({ kind: "unblock", block_id: +el.dataset.unblock })));
}

async function renderDay(main) {
  renderMasterChips();
  const d = await api(`day?date=${S.date}${S.master ? "&master=" + S.master : ""}`);
  const day = d.days[0];
  $("datelabel").textContent = day.day;
  const multi = S.me.role === "owner" && !S.master && S.me.masters.length > 1;
  const hours = Object.entries(day.hours).map(([n, h]) => `${n} ${h === "off" ? t("day_off") : h}`).join(" · ");
  let html = `<p class="hours">${esc(hours)}</p>`;
  html += day.blocks.map((bl) => blockRow(bl, multi)).join("");
  html += day.bookings.length ? day.bookings.map((b) => bookingCard(b, multi)).join("") : `<p class="empty">${esc(t("no_bookings"))}</p>`;
  main.innerHTML = html;
  bindList(main, day.bookings);
}

async function renderWeek(main) {
  const d = await api(`week?date=${S.me.today}${S.master ? "&master=" + S.master : ""}`);
  const multi = S.me.role === "owner" && !S.master && S.me.masters.length > 1;
  const all = [];
  main.innerHTML = d.days.map((day) => {
    all.push(...day.bookings);
    const active = day.bookings.filter((b) => b.status === "active").length;
    return `<div class="dayhead">${esc(day.day)}<small>${active}</small></div>` +
      day.blocks.map((bl) => blockRow(bl, multi)).join("") + day.bookings.map((b) => bookingCard(b, multi)).join("");
  }).join("");
  bindList(main, all);
}

  requestAnimationFrame(() => $("sheet").classList.add("open"));
}
function closeSheet() {
  $("sheet").classList.remove("open"); $("sheetbg").style.display = "none";
  stopSpeaking();
  if (V.rec) V.rec.abort();
}
$("sheetbg").onclick = closeSheet;

function openBooking(b) {
  const owner = S.me.role === "owner";
  const today = S.me.today;
  const acts = [];
  if (b.phone) acts.push(`<a class="btn" href="tel:${esc(b.phone)}">📞 ${esc(t("call"))} ${esc(b.phone)}</a>`);
  if (b.status === "active" && b.date <= today) acts.push(`<button class="btn" data-a="noshow">🚫 ${esc(t("noshow"))}</button>`);
  if (owner && b.status === "active" && !b.past) {
    acts.push(`<button class="btn" data-a="resched">🔁 ${esc(t("resched"))}</button>`);
    acts.push(`<button class="btn red" data-a="cancel">❌ ${esc(t("cancel"))}</button>`);
  }
  if (owner && b.in_chat) acts.push(`<button class="btn" data-a="write">✉️ ${esc(t("write"))}</button>`);
  openSheet(`<h3>${esc(b.time)}–${esc(b.end)} · ${esc(b.client)}</h3>
    <p class="sub">${esc(b.day)}\n${esc(b.service)} · ${esc(b.master)} · ${esc(b.price)}${b.note ? "\n📝 " + esc(b.note) : ""}</p>
    ${badges(b)}${acts.join("")}<button class="btn" onclick="closeSheet()">${esc(t("close"))}</button>`);
  const body = $("sheetbody");
  body.querySelectorAll("[data-a]").forEach((el) => (el.onclick = () => {
    const a = el.dataset.a;
    if (a === "noshow") propose({ kind: "no_show", booking_id: b.booking_id });
    if (a === "cancel") propose({ kind: "cancel", booking_id: b.booking_id });
    if (a === "resched") formResched(b);
    if (a === "write") formMessage(b.client_id, b.client);
  }));
}

async function propose(data) {
  const plan = await api("propose", data);

function showConfirm(plan, intro) {
  openSheet(`${intro ? `<div class="reply">${esc(intro)}</div>` : ""}<div class="summary">${esc(plan.summary)}</div>
    <button class="btn gold" id="cyes">${esc(t("yes"))}</button><button class="btn" id="cno">${esc(t("no"))}</button>`);
  $("cyes").onclick = async () => {
    $("cyes").disabled = true;
    const r = await api("confirm", { action_id: plan.action_id }).catch(() => null);

    if (r) { toast(r.text); render(); }
  };

}

  box.innerHTML = times.length ? times.map((tm) => `<button class="chip" data-t="${tm}">${tm}</button>`).join("") : `<span class="sub">${esc(t("no_times"))}</span>`;

    box.querySelectorAll(".chip").forEach((c) => c.classList.remove("on")); el.classList.add("on"); pick(el.dataset.t);

}

async function renderChats(main) {

  main.innerHTML = d.chats.map((c, i) => {
    const last = c.messages[c.messages.length - 1] || {};
    return `<button class="card chatrow" data-i="${i}"><div><div class="nm">${esc(c.name)} ${c.waiting_for_human ? `<i class="badge red">${esc(t("waiting"))}</i>` : ""}</div>
      <div class="lt">${esc(last.text)}</div></div><small class="badge">${esc(c.channel)}</small></button>`;

  openSheet(`<h3>${esc(c.name)} ${c.phone ? `<small class="sub">${esc(c.phone)}</small>` : ""}</h3>
    ${c.messages.map((m) => `<div class="bubble ${m.from}"><small>${esc(m.at.slice(11))}</small>${esc(m.text)}</div>`).join("")}
    <textarea class="f" id="ctext" placeholder="${esc(t("reply"))}…" style="margin-top:12px"></textarea>
    <button class="btn gold" id="csend">${esc(t("reply"))}</button>

    <div class="card"><b>🎙 ${esc(t("examples"))}</b><ul class="ex">${t("ex").map((e) => `<li>«${esc(e)}»</li>`).join("")}</ul>

    <button class="btn red" id="logout">${esc(t("logout"))}</button>`;
  $("autol").onchange = (e) => { S.autoListen = e.target.checked; try { localStorage.setItem("bb_autolisten", S.autoListen ? "1" : "0"); } catch (x) { /* */ } };
  $("push").onclick = enablePush;
  const ios = /iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone;
  if (ios) $("pushhint").textContent = t("push_ios");
  // Один особистий ключ і для конектора AI, і для Siri: обидві кнопки створюють його й показують дані в обох блоках.
  main.querySelectorAll("[data-mkkey]").forEach((b) => (b.onclick = async () => {
    const k = await api("key", {});
    const copyBtn = (v) => `<button class="btn" data-copy="${esc(v)}">${esc(t("copy"))}</button>`;
    const warn = `<p class="sub">${esc(t("key_warn"))}</p>`;
    $("mcpbox").innerHTML = `${warn}<label class="f">MCP URL</label><div class="mono">${esc(k.mcp_url)}</div>${copyBtn(k.mcp_url)}`;
    $("keybox").innerHTML = `${warn}<label class="f">URL</label><div class="mono">${esc(k.ask_url)}</div>${copyBtn(k.ask_url)}
      <label class="f">Authorization</label><div class="mono">Bearer ${esc(k.key)}</div>${copyBtn("Bearer " + k.key)}`;
    main.querySelectorAll("[data-copy]").forEach((c) => (c.onclick = () => navigator.clipboard.writeText(c.dataset.copy).then(() => toast(t("copied")))));
  }));
  $("logout").onclick = async () => { await api("logout", {}); showLoggedOut(); };
}

async function enablePush() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) { toast(t("push_ios"), 6000); return; }
    const reg = await navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE });
    await navigator.serviceWorker.ready;
    if ((await Notification.requestPermission()) !== "granted") return;
    const key = Uint8Array.from(atob(S.me.push_key.replace(/-/g, "+").replace(/_/g, "/") + "==".slice(0, (4 - S.me.push_key.length % 4) % 4)), (c) => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
    await api("push", { endpoint: sub.endpoint });
    toast(t("push_ok"));
  } catch (e) { toast(t("error")); }
}

    : `<p class="empty">${esc(t("no_notes"))}</p>`));

$("bell").onclick = openNotes;
async function checkNotes() {
  try {
    const d = await api("notes", undefined, { soft: true });
    const last = d.notes && d.notes.length ? d.notes[d.notes.length - 1].id : "";
    let seen = ""; try { seen = localStorage.getItem("bb_seen") || ""; } catch (e) { /* */ }

// ------------------------------------------------------------------ голос
// Голос розпізнає сам телефон — безкоштовно: SpeechRecognition браузера (на iPhone — Siri, на Android — Google).
// Де його немає — поле вводу: 🎤 на клавіатурі телефону теж надиктує текст. На сервер іде лише текст.
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const V = { rec: null, busy: false };
const VOICE_LANGS = ["uk", "hu", "en", "ru", "de"];

function voiceLang() {
  try { return localStorage.getItem("bb_vlang") || S.me.lang; } catch (e) { return S.me.lang; }
}

function stopSpeaking() { try { speechSynthesis.cancel(); } catch (e) { /* */ } }

function speak(text, then) {
  if (!text || !("speechSynthesis" in window)) { if (then) then(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH_LANG[voiceLang()] || "en-US";
  const voice = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith(u.lang.slice(0, 2)));
  if (voice) u.voice = voice;
  u.onend = () => then && then();
  u.onerror = () => then && then();
  stopSpeaking(); speechSynthesis.speak(u);
}

function setMic(state) {
  $("mic").classList.toggle("rec", state === "rec");
  $("mic").classList.toggle("wait", state === "wait");
  $("mic").textContent = state === "rec" ? "■" : "🎙";
}

// quick — коротке слухання після «Підтверджуєте?»: тиша — просто закриваємо.
function startListening(quick) {
  if (V.rec || V.busy) return;
  stopSpeaking();
  if (!Rec) { assistantSheet(t("dictate_hint")); setTimeout(() => $("asktext") && $("asktext").focus(), 300); return; }
  const rec = new Rec();
  rec.lang = SPEECH_LANG[voiceLang()] || "uk-UA";
  rec.interimResults = true;
  rec.continuous = false;
  let final = "", interim = "";
  V.rec = rec;
  setMic("rec");
  if (!quick) assistantSheet(t("speak"));
  rec.onresult = (e) => {
    interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    const live = $("live"); if (live) live.textContent = final + interim;
  };
  rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") toast(t("mic_denied")); };
  rec.onend = () => {
    V.rec = null; setMic("");
    const text = (final || interim).trim();
    if (text) askText(text);
    else if (!quick) assistantSheet(t("dictate_hint"));
  };
  try { rec.start(); } catch (e) { V.rec = null; setMic(""); assistantSheet(t("dictate_hint")); }
}

function stopListening() { if (V.rec) V.rec.stop(); }

async function askText(text) {
  V.busy = true; setMic("wait");
  assistantSheet(t("thinking"), text);
  try { showAnswer({ ...(await api("ask", { text })), heard: text }); }
  catch (e) { assistantSheet(t("error")); }
  finally { V.busy = false; setMic(""); }
}

function askBox() {
  const cur = voiceLang();
  return `<div class="ask"><input class="f" id="asktext" placeholder="${esc(t("type"))}" enterkeyhint="send"><button id="asksend">➤</button></div>
    <div class="chips"><span class="sub" style="margin:6px 4px 0 0">${esc(t("voice_lang"))}:</span>${VOICE_LANGS.map((l) =>
      `<button class="chip ${l === cur ? "on" : ""}" data-vl="${l}">${l.toUpperCase()}</button>`).join("")}</div>`;
}

function bindAskBox() {
  const send = () => { const text = $("asktext").value.trim(); if (text) { stopListening(); askText(text); } };
  $("asksend").onclick = send;
  $("asktext").onkeydown = (e) => { if (e.key === "Enter") send(); };
  document.querySelectorAll("[data-vl]").forEach((b) => (b.onclick = () => {
    try { localStorage.setItem("bb_vlang", b.dataset.vl); } catch (e) { /* */ }
    document.querySelectorAll("[data-vl]").forEach((x) => x.classList.toggle("on", x === b));
  }));
}

function assistantSheet(status, heard) {
  openSheet(`${heard ? `<div class="heard">«${esc(heard)}»</div>` : ""}<div class="reply">${esc(status || "")}</div>
    <div class="reply" id="live" style="color:var(--gold)"></div>${askBox()}`);
  bindAskBox();
}

function showAnswer(r) {
  const heard = r.heard ? `<div class="heard">${esc(t("heard"))}: «${esc(r.heard)}»</div>` : "";
  if (r.action) {
    openSheet(`${heard}<div class="reply">${esc(r.text)}</div><div class="summary">${esc(r.action.summary)}</div>
      <div class="reply" id="live" style="color:var(--gold)"></div>
      <button class="btn gold" id="cyes">${esc(t("yes"))}</button><button class="btn" id="cno">${esc(t("no"))}</button>`);
    $("cyes").onclick = async () => { stopListening(); showAnswer(await api("confirm", { action_id: r.action.action_id })); };
    $("cno").onclick = async () => { stopListening(); await api("decline", { action_id: r.action.action_id }); closeSheet(); };
    speak(r.text, () => { if (S.autoListen && $("cyes")) startListening(true); });
    return;
  }
  openSheet(`${heard}<div class="reply">${esc(r.text)}</div>${askBox()}`);
  bindAskBox();
  speak(r.text);
  if (r.done) render();
}

$("mic").onclick = () => (V.rec ? stopListening() : startListening(false));

// ------------------------------------------------------------------ дата
$("prev").onclick = () => { S.date = shift(S.date, -1); render(); };
$("next").onclick = () => { S.date = shift(S.date, 1); render(); };
$("datelabel").onclick = () => { const p = $("datepick"); p.value = S.date; if (p.showPicker) p.showPicker(); else p.click(); };
$("datepick").onchange = (e) => { if (e.target.value) { S.date = e.target.value; render(); } };

// ------------------------------------------------------------------ старт
(async function init() {
  try { S.me = await api("me"); } catch (e) { return; }
  L = I18N[S.me.lang] || I18N.en;
  document.documentElement.lang = S.me.lang;
  document.title = S.me.shop;
  $("shop").textContent = S.me.shop;
  S.date = S.me.today;
  if (S.me.role === "owner" && S.me.master_id && S.me.masters.length > 1) S.master = "";
  render();
  checkNotes(); setInterval(checkNotes, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); checkNotes(); } });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE }).catch(() => {});
    navigator.serviceWorker.addEventListener("message", () => { render(); checkNotes(); });
  }
  if (S.me.pending) showConfirm(S.me.pending);
  if (location.hash === "#voice") { history.replaceState(null, "", location.pathname); startListening(false); }
})();
