   Навмисно один темний вигляд — фірмовий синій із золотом закладу. */
:root {
  --bg: #0b111d; --surface: #131b2b; --surface-2: #19233a;
  --line: rgba(227, 176, 75, .22); --line-soft: rgba(238, 241, 247, .08);
  --gold: #e3b04b; --gold-hi: #f6dc97; --fg: #eef1f7; --muted: #95a1b8; --dim: #5f6a80;
  --err: #ff9a8a;
  --display: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
  --body: "Manrope", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100%; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

.top { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 75%, rgba(11,17,29,.94));
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 42px; height: 42px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 40%, #23314f, #0c1220 75%);
  border: 1px solid var(--line); display: grid; place-items: center; }
.brand-name { min-width: 0; flex: 1; }
.brand-name b { display: block; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: .01em; line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #b8862c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-name span { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.langs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; flex: none; }
.langs button { border: 0; background: none; padding: 4px 7px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.langs button[aria-pressed="true"] { background: var(--gold); color: #1b1408; }
.rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.rail div { height: 3px; border-radius: 3px; background: var(--line-soft); transition: background .3s; }
.rail div.on { background: var(--gold); }
.stepname { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.stepname b { color: var(--fg); font-weight: 700; }

main { flex: 1; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 130px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -.005em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: -8px 0 0; font-size: 14px; }
.sec { margin: 4px 0 -6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.chips, .days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar, .days::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); background: rgba(227,176,75,.08); }

.list { display: flex; flex-direction: column; gap: 10px; }
.svc { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 2px 12px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; transition: border-color .2s, background .2s; }
.svc[aria-pressed="true"] { border-color: var(--gold); background: var(--surface-2); }
.svc .i { grid-row: span 3; font-size: 20px; line-height: 1.3; }
.svc .t { font-weight: 700; font-size: 16px; min-width: 0; }
.svc .p { font-weight: 800; color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.svc .d { grid-column: 2 / -1; color: var(--muted); font-size: 13px; }
.svc .m { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }

.masters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mst { text-align: left; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mst[aria-pressed="true"] { border-color: var(--gold); background: var(--surface-2); }
.ava { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; color: #1b1408;
  background: linear-gradient(145deg, var(--gold-hi), var(--gold) 55%, #a87726); }
.ava.any { background: var(--surface-2); color: var(--gold); border: 1px dashed var(--line); font-family: var(--body); }
.mst b { font-size: 16px; }
.mst small { color: var(--muted); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.day { flex: none; width: 58px; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line-soft); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day .w { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.day .n { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day .mo { font-size: 11px; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1b1408; }
.day[aria-pressed="true"] .w, .day[aria-pressed="true"] .mo { color: #3b2c0f; }
.day[disabled] { opacity: .35; cursor: not-allowed; }
.part { display: flex; flex-direction: column; gap: 8px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { padding: 11px 0; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line-soft); border-radius: var(--r); padding: 18px; text-align: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; gap: 12px; }
.row span:first-child { color: var(--muted); flex: none; }
.row span:last-child { text-align: right; font-weight: 700; min-width: 0; }
.row.total { border-top: 1px solid var(--line-soft); padding-top: 10px; font-size: 17px; }
.row.total span:last-child { color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.addon { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; }
.addon > div { flex: 1; min-width: 0; }
.addon b { font-weight: 700; }
.addon small { display: block; color: var(--muted); }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: #3a4357; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--gold); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.field input { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 13px 14px; font: inherit; color: var(--fg); width: 100%; }
.field input::placeholder { color: var(--dim); }
.hint { color: var(--muted); font-size: 13px; }
.err { color: var(--err); font-size: 14px; margin: 0; }
.prepay { white-space: pre-line; font-size: 14px; color: var(--fg); }

.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-top: 18px; }
.tick { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(227,176,75,.25), transparent 70%); border: 1px solid var(--gold); }
.done .card { width: 100%; text-align: left; }
.loading { display: grid; place-items: center; min-height: 40vh; color: var(--muted); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-soft); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(rgba(11,17,29,0), var(--bg) 30%);
  padding: 26px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 428px; margin: 0 auto; display: flex; gap: 10px; }
.back { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 14px; width: 54px; flex: none; font-size: 22px; }
.cta { flex: 1; border: 0; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 16px; letter-spacing: .02em; color: #1b1408;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 8px 24px rgba(227,176,75,.18); }
.cta[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.cta small { display: block; font-weight: 600; font-size: 12px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const authHeaders = tg ? { "X-Telegram-Init-Data": tg.initData } : (token ? { "X-Booking-Token": token } : {});

async function api(path, opts = {}) {
  const r = await fetch(base + "api/" + path, { ...opts, headers: { ...authHeaders, ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.message || ""); e.data = data; throw e; }
  return data;
}

// ---------------------------------------------------------------- стан
const st = { cfg: null, lang: "en", step: 0, group: null, service: null, addon: null, master: null, days: null, day: null, times: null, time: null,
  name: "", phone: "", error: "", busy: false, done: null };
const u = k => (UI[st.lang] || UI.en)[k];
const fmt = n => (st.cfg.price_format || "{price}").replace("{price}", String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "));
const allServices = () => st.cfg.groups.flatMap(g => g.services);
const svc = () => allServices().find(s => s.id === st.service);
const addon = () => (svc() && st.addon) ? svc().addons.find(a => a.id === st.addon) : null;
const effId = () => st.addon || st.service;
const dur = () => (svc() ? svc().duration : 0) + (addon() ? addon().duration : 0);
const price = () => (svc() ? svc().price : 0) + (addon() ? addon().price : 0);
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

function pickLang(langs) {
  const want = [params.get("lang"), tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code,
    ...(navigator.languages || [navigator.language])].filter(Boolean).map(l => l.slice(0, 2).toLowerCase());
  let saved = null; try { saved = localStorage.getItem("booking-lang"); } catch (e) {}
  for (const l of [saved, ...want]) if (l && langs.includes(l)) return l;
  return langs.includes("en") ? "en" : langs[0];
}

async function loadConfig(lang) {
  const cfg = await api("config?" + new URLSearchParams({ lang, u: token }));
  st.cfg = cfg; st.lang = cfg.lang;
  if (!st.group || !cfg.groups.some(g => g.id === st.group)) st.group = cfg.groups[0] ? cfg.groups[0].id : null;
  if (!st.name) st.name = cfg.client.name || "";
  if (!st.phone) st.phone = cfg.client.phone || "";
  document.title = cfg.name;
}

// ---------------------------------------------------------------- розмітка
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat()) if (c != null && c !== "") n.append(c.nodeType ? c : document.createTextNode(c)); return n; };
const main = document.getElementById("main");

function viewService() {
  const groups = st.cfg.groups, g = groups.find(x => x.id === st.group) || groups[0], s = svc();
  return [
    el("h1", {}, u("s1")), el("p", { class: "sub" }, u("s1sub")),
    groups.length > 1 ? el("div", { class: "chips" }, groups.map(x => el("button", { class: "chip", "aria-pressed": String(x.id === g.id),
      onclick: () => { st.group = x.id; render(); } }, x.title || "•"))) : null,
    el("div", { class: "list" }, g.services.map(x => el("button", { class: "svc", "aria-pressed": String(st.service === x.id),
      onclick: () => { if (st.service !== x.id) { st.service = x.id; st.addon = null; st.master = null; st.day = null; st.time = null; } render(); } },
      el("span", { class: "i" }, x.icon || "✂️"), el("span", { class: "t" }, x.title), el("span", { class: "p" }, x.price_text),
      x.description ? el("span", { class: "d" }, x.description) : null, el("span", { class: "m" }, `⏱ ${x.duration} ${u("min")}`)))),
    s && s.addons.length ? [el("p", { class: "sec" }, u("addons")), s.addons.map(a => el("div", { class: "addon" },
      el("div", {}, el("b", {}, a.title), el("small", {}, `${a.price_text} · +${a.duration} ${u("min")}`)),
      el("button", { class: "switch", role: "switch", "aria-checked": String(st.addon === a.id), "aria-label": a.title,
        onclick: () => { st.addon = st.addon === a.id ? null : a.id; st.master = null; st.day = null; st.time = null; render(); } })))] : null,
  ];
}
function viewMaster() {
  const ms = st.cfg.masters.filter(m => m.services.includes(effId()));
  if (ms.length === 1 && !st.master) st.master = ms[0].id;
  return [
    el("h1", {}, u("s2")), el("p", { class: "sub" }, u("s2sub")),
    el("div", { class: "masters" },
      ms.length > 1 ? el("button", { class: "mst", "aria-pressed": String(st.master === "any"), onclick: () => pickMaster("any") },
        el("div", { class: "ava any" }, "✦"), el("b", {}, u("any")), el("small", {}, u("anyAbout"))) : null,
      ms.map(m => el("button", { class: "mst", "aria-pressed": String(st.master === m.id), onclick: () => pickMaster(m.id) },
        el("div", { class: "ava" }, m.name.slice(0, 1)), el("b", {}, m.name), m.about ? el("small", {}, m.about) : null))),
  ];
}
function pickMaster(id) { if (st.master !== id) { st.master = id; st.days = null; st.day = null; st.time = null; } render(); }

function viewTime() {
  if (!st.days) { loadDays(); return [el("div", { class: "loading" }, el("div", { class: "spin" }))]; }
  const open = st.days.filter(d => d.open);
  if (!open.length) return [el("h1", {}, u("s3")), el("div", { class: "empty" }, u("noDays"))];
  const parts = [["morning", 0, 720], ["afternoon", 720, 1020], ["evening", 1020, 1440]];
  return [
    el("h1", {}, u("s3")), el("p", { class: "sub" }, u("s3sub")),
    el("div", { class: "days" }, st.days.map((d, i) => { const dt = parseDay(d.date);
      return el("button", { class: "day", disabled: !d.open, "aria-pressed": String(st.day === d.date), onclick: () => pickDay(d.date) },
        el("span", { class: "w" }, i === 0 ? u("today") : u("wd")[dt.getDay()]), el("span", { class: "n" }, dt.getDate()),
        el("span", { class: "mo" }, d.open ? u("mon")[dt.getMonth()] : u("closed"))); })),
    !st.times ? el("div", { class: "loading", style: "min-height:20vh" }, el("div", { class: "spin" }))
      : st.times.length ? parts.map(([key, a, b]) => { const ts = st.times.filter(x => toMin(x) >= a && toMin(x) < b);
          return ts.length ? el("div", { class: "part" }, el("p", { class: "sec" }, u(key)), el("div", { class: "slots" }, ts.map(x =>
            el("button", { class: "slot", "aria-pressed": String(st.time === x), onclick: () => { st.time = x; render(); } }, x)))) : null; })
      : el("div", { class: "empty" }, u("noSlots")),
  ];
}
async function loadDays() {
  try {
    const r = await api("days?" + new URLSearchParams({ service: effId(), master: st.master }));
    st.days = r.days;
    const first = r.days.find(d => d.open);
    if (first) { st.day = null; await pickDay(first.date, true); } else render();
  } catch (e) { st.error = u("net"); st.days = []; render(); }
}
async function pickDay(date, silent) {
  st.day = date; st.time = null; st.times = null; if (!silent) render();
  try { st.times = (await api("slots?" + new URLSearchParams({ service: effId(), master: st.master, date }))).times; }
  catch (e) { st.times = []; }
  render();
}
function whenText() { const d = parseDay(st.day); return `${u("wd")[d.getDay()]}, ${d.getDate()} ${u("mon")[d.getMonth()]} · ${st.time}`; }
function masterName() { return st.master === "any" ? u("any") : (st.cfg.masters.find(m => m.id === st.master) || {}).name; }
function viewDetails() {
  const s = svc(), a = addon(), known = st.cfg.client.known;
  return [
    el("h1", {}, u("s4")), el("p", { class: "sub" }, u("s4sub")),
    el("div", { class: "card" },
      el("div", { class: "row" }, el("span", {}, u("service")), el("span", {}, s.title + (a ? " + " + a.title : ""))),
      el("div", { class: "row" }, el("span", {}, u("master")), el("span", {}, masterName())),
      el("div", { class: "row" }, el("span", {}, u("when")), el("span", {}, whenText())),
      el("div", { class: "row" }, el("span", {}, u("duration")), el("span", {}, `${dur()} ${u("min")}`)),
      el("div", { class: "row total" }, el("span", {}, u("total")), el("span", {}, fmt(price())))),
    el("div", { class: "field" }, el("label", { for: "nm" }, u("name")),
      el("input", { id: "nm", autocomplete: "name", placeholder: u("namePh"), value: st.name, oninput: e => { st.name = e.target.value; syncCta(); } })),
    (!known || st.cfg.require_phone) ? el("div", { class: "field" }, el("label", { for: "ph" }, u("phone")),
      el("input", { id: "ph", type: "tel", autocomplete: "tel", inputmode: "tel", placeholder: u("phonePh"), value: st.phone, oninput: e => { st.phone = e.target.value; syncCta(); } }),
      el("span", { class: "hint" }, u("phoneHint"))) : null,
    st.error ? el("p", { class: "err" }, st.error) : null,
  ];
}
function viewDone() {
  const b = st.done;
  return [el("section", { class: "done" },
    el("div", { class: "tick", "aria-hidden": "true" }, (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("width", "34"); s.setAttribute("height", "34"); s.setAttribute("viewBox", "0 0 24 24");
      s.innerHTML = '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#f6dc97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'; return s; })()),
    el("h1", {}, u("doneT")), el("p", { class: "sub", style: "margin:0" }, u("doneSub") + (b.in_chat ? " " + u("inChat") : "")),
    el("div", { class: "card" },
      el("div", { class: "row" }, el("span", {}, "#"), el("span", {}, String(b.id))),
      el("div", { class: "row" }, el("span", {}, u("service")), el("span", {}, b.service)),
      el("div", { class: "row" }, el("span", {}, u("master")), el("span", {}, b.master)),
      el("div", { class: "row" }, el("span", {}, u("when")), el("span", {}, `${b.day} · ${b.time}`)),
      el("div", { class: "row total" }, el("span", {}, u("total")), el("span", {}, b.price_text))),
    b.prepay ? el("div", { class: "card prepay" }, b.prepay) : null)];
}

// ---------------------------------------------------------------- навігація
const cta = document.getElementById("cta"), back = document.getElementById("back");
const ready = () => [!!st.service, !!st.master, !!st.time, true][st.step];
function syncCta() {
  if (st.done) { cta.disabled = false; cta.textContent = tg ? u("close") : u("again"); return; }
  cta.disabled = st.busy || !ready();
  if (st.step === 3) { cta.replaceChildren(u("book"), el("small", {}, `${fmt(price())} · ${dur()} ${u("min")}`)); }
  else cta.textContent = u("next");
}
function render() {
  if (!st.cfg) return;
  document.documentElement.lang = st.lang;
  document.getElementById("bname").textContent = st.cfg.name;
  document.getElementById("tagline").textContent = st.cfg.address || u("tagline");
  const langs = document.getElementById("langs");
  langs.hidden = st.cfg.languages.length < 2;
  langs.replaceChildren(...st.cfg.languages.map(l => el("button", { "aria-pressed": String(st.lang === l), onclick: () => switchLang(l) }, l.toUpperCase())));
  [...document.getElementById("rail").children].forEach((d, i) => d.classList.toggle("on", !!st.done || i <= st.step));
  document.getElementById("stepTitle").textContent = st.done ? u("doneT") : u("steps")[st.step];
  document.getElementById("stepCount").textContent = st.done ? "" : `${st.step + 1} / 4`;
  back.hidden = st.step === 0 || !!st.done;
  main.replaceChildren(...[].concat(st.done ? viewDone() : [viewService, viewMaster, viewTime, viewDetails][st.step]()).flat(Infinity).filter(Boolean));
  syncCta();
}
async function switchLang(l) {
  try { localStorage.setItem("booking-lang", l); } catch (e) {}
  try { await loadConfig(l); } catch (e) {}
  render();
}
function go(step) { st.step = step; st.error = ""; render(); window.scrollTo(0, 0); }
cta.addEventListener("click", async () => {
  if (st.done) {
    if (tg) { tg.close(); return; }
    Object.assign(st, { step: 0, service: null, addon: null, master: null, days: null, day: null, times: null, time: null, done: null });
    return go(0);
  }
  if (st.step < 3) {
    if (st.step === 1) { st.days = null; st.times = null; }
    return go(st.step + 1);
  }
  const known = st.cfg.client.known;
  if ((!known && st.name.trim().length < 2) || ((!known || st.cfg.require_phone) && st.phone.replace(/\D/g, "").length < 9)) {
    st.error = u("needContact"); return render();
  }
  st.busy = true; st.error = ""; syncCta();
  try {
    const r = await api("book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      service: effId(), master: st.master, date: st.day, time: st.time, name: st.name.trim(), phone: st.phone.trim(), lang: st.lang, token }) });
    st.done = r.booking;
    if (tg) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
  } catch (e) {
    st.error = (e.data && e.data.message) || u("net");
    if (e.data && ["slot_taken", "past", "too_soon", "too_far"].includes(e.data.error)) { st.time = null; st.times = null; st.step = 2; pickDay(st.day); }
  }
  st.busy = false; render(); window.scrollTo(0, 0);
});
back.addEventListener("click", () => { if (st.step > 0) go(st.step - 1); });
if (tg) tg.BackButton && tg.onEvent && tg.onEvent("backButtonClicked", () => back.click());

(async function start() {
  try {
    const first = await api("config?" + new URLSearchParams({ u: token }));
    await loadConfig(pickLang(first.languages));
    render();
  } catch (e) {
    main.replaceChildren(el("div", { class: "empty" }, (UI[pickLang(Object.keys(UI))] || UI.en).net));
  }
})();
</script>
