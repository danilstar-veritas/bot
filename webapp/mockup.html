<style>
/* Layout: one-column phone app (max 460px), sticky brand header with step rail, sticky bottom action bar.
   Single dark look on purpose: the studio's navy-and-gold identity from the avatar and the Facebook cover. */
:root {
  --bg: #0b111d;
  --surface: #131b2b;
  --surface-2: #19233a;
  --line: rgba(227, 176, 75, .22);
  --line-soft: rgba(238, 241, 247, .08);
  --gold: #e3b04b;
  --gold-hi: #f6dc97;
  --fg: #eef1f7;
  --muted: #95a1b8;
  --busy: #3a4357;
  --ok: #6fcf97;
  --display: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
  --body: "Manrope", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(var(--bg) 70%, rgba(11,17,29,.92));
  padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 42px; height: 42px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 40%, #23314f, #0c1220 75%); border: 1px solid var(--line); display: grid; place-items: center; }
.brand-name { min-width: 0; flex: 1; }
.brand-name b { display: block; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .02em; line-height: 1.05;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, #b8862c); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-name span { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.langs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px; flex: none; }
.langs button { border: 0; background: none; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.langs button[aria-pressed="true"] { background: var(--gold); color: #1b1408; }
.rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.rail div { height: 3px; border-radius: 3px; background: var(--line-soft); transition: background .3s; }
.rail div.on { background: var(--gold); }
.stepname { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.stepname b { color: var(--fg); font-weight: 600; }

/* content */
main { flex: 1; padding-block: 18px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: -10px 0 0; font-size: 14px; }
.demo { align-self: flex-start; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line-soft); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); background: rgba(227,176,75,.08); }

.list { display: flex; flex-direction: column; gap: 10px; }
.svc { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; transition: border-color .2s, background .2s; }
.svc:hover { border-color: var(--line); }
.svc[aria-pressed="true"] { border-color: var(--gold); background: var(--surface-2); }
.svc .t { font-weight: 600; font-size: 16px; min-width: 0; }
.svc .p { font-weight: 700; color: var(--gold-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.svc .d { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.svc .m { grid-column: 1 / -1; display: flex; gap: 12px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }

.masters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mst { text-align: left; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mst[aria-pressed="true"] { border-color: var(--gold); background: var(--surface-2); }
.mst[disabled] { opacity: .4; cursor: not-allowed; }
.ava { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 19px; color: #1b1408;
  background: linear-gradient(145deg, var(--gold-hi), var(--gold) 55%, #a87726); }
.ava.any { background: var(--surface-2); color: var(--gold); border: 1px dashed var(--line); font-family: var(--body); font-size: 20px; }
.mst b { font-size: 16px; }
.mst small { color: var(--muted); font-size: 12px; line-height: 1.35; }

.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 58px; padding: 10px 0; border-radius: 12px; border: 1px solid var(--line-soft); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day .w { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.day .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .mo { font-size: 11px; color: var(--muted); }
.day[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1b1408; }
.day[aria-pressed="true"] .w, .day[aria-pressed="true"] .mo { color: #3b2c0f; }
.day[disabled] { opacity: .35; cursor: not-allowed; }
.part { display: flex; flex-direction: column; gap: 8px; }
.part h3 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { padding: 11px 0; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.slot[aria-pressed="true"] { background: var(--gold); color: #1b1408; border-color: var(--gold); }
.slot[disabled] { color: var(--busy); text-decoration: line-through; background: transparent; cursor: not-allowed; }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line-soft); border-radius: var(--r); padding: 18px; text-align: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; gap: 12px; }
.row span:first-child { color: var(--muted); }
.row span:last-child { text-align: right; font-weight: 600; min-width: 0; }
.row.total { border-top: 1px solid var(--line-soft); padding-top: 10px; font-size: 17px; }
.row.total span:last-child { color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.addon { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; }
.addon > div { flex: 1; min-width: 0; }
.addon small { display: block; color: var(--muted); }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--busy); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--gold); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field input { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 13px 14px; font: inherit; color: var(--fg); }
.field input::placeholder { color: #5f6a80; }
.hint { color: var(--muted); font-size: 13px; }
.err { color: #ff9a8a; font-size: 13px; }

.done { align-items: center; text-align: center; padding-top: 24px; }
.tick { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(227,176,75,.25), transparent 70%); border: 1px solid var(--gold); }
.done .card { width: 100%; text-align: left; }

/* bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(rgba(11,17,29,0), var(--bg) 30%);
  padding-top: 26px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 428px; margin: 0 auto; display: flex; gap: 10px; }
.back { border: 1px solid var(--line-soft); background: var(--surface); border-radius: 14px; width: 54px; flex: none; font-size: 20px; }
.cta { flex: 1; border: 0; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 16px; letter-spacing: .02em; color: #1b1408;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 8px 24px rgba(227,176,75,.18); }
.cta[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.cta small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  S("kids_girl_long", "girls", 60, 5500, "Hosszú hajú hercegnő", "Довгокоса принцеса", "Long-haired princess", "Prinzessin mit langem Haar"),
];
const WASH = { dur: 15, price: 1500, t: { hu: "Hajmosás", uk: "Миття голови", en: "Hair wash", de: "Haarwäsche" },
  d: { hu: "+15 perc · ellazító fejmasszázzsal", uk: "+15 хв · з масажем голови", en: "+15 min · with a relaxing scalp massage", de: "+15 Min. · mit Kopfmassage" },
  for: ["haircut", "combo", "buzz", "women_short", "women_medium", "women_long", "pixie", "kids_boy", "kids_buzz", "kids_girl", "kids_girl_long"] };
// графік: [пн..нд] → [від, до] у хвилинах, null — вихідний
const WEEK = [[540, 1140], [540, 1140], [540, 1140], [540, 1140], [540, 1140], [540, 840], null];
const MEN = ["haircut", "beard", "combo", "buzz", "kids_boy", "kids_buzz"];
const ALL = SERVICES.map(s => s.id).filter(id => id !== "beard" && id !== "combo");
const MASTERS = [
  { id: "bence", name: "Bence", does: MEN, week: WEEK, about: { hu: "Fade-mester, bakelit és fekete kávé", uk: "Майстер фейдів, вініл і чорна кава", en: "Fade master, vinyl and black coffee", de: "Fade-Meister, Vinyl und schwarzer Kaffee" } },
  { id: "mate", name: "Máté", does: MEN, week: [null, ...WEEK.slice(1, 6), [660, 1020]], about: { hu: "A szakáll művésze", uk: "Митець бороди", en: "The beard artist", de: "Der Bartkünstler" } },
  { id: "reka", name: "Réka", does: ALL, week: WEEK, about: { hu: "Ötpercnyi beszélgetés, tökéletes frizura", uk: "П'ять хвилин розмови – ідеальна стрижка", en: "Five minutes of talk, the perfect cut", de: "Fünf Minuten Gespräch, die perfekte Frisur" } },
  { id: "zsofi", name: "Zsófi", does: ALL, week: WEEK, about: { hu: "A gyerekek kedvence", uk: "Улюблениця дітей", en: "Kids' favourite", de: "Liebling der Kinder" } },
];

// ---------------------------------------------------------------- стан
const st = { lang: "hu", step: 0, group: "men", service: null, master: null, day: null, time: null, wash: false, name: "", phone: "+36 ", done: null, error: "" };
try { const l = localStorage.getItem("mo-lang"); if (l && T[l]) st.lang = l; } catch (e) {}
const t = k => T[st.lang][k];
const ft = n => n.toLocaleString("hu-HU").replace(/ /g, " ") + " Ft";
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const svc = () => SERVICES.find(s => s.id === st.service);
const dur = () => (svc()?.dur || 0) + (st.wash ? WASH.dur : 0);
const price = () => (svc()?.price || 0) + (st.wash ? WASH.price : 0);
const today = new Date(); today.setHours(0, 0, 0, 0);
const DAYS = Array.from({ length: 14 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
const wdIdx = d => (d.getDay() + 6) % 7; // пн = 0
const hash = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// тестова «зайнятість»: детерміновано, щоб розклад виглядав живим
const busy = (mid, d, m) => hash(mid + d.toDateString() + m) % 10 < 3;
function freeFor(master, d) {
  const w = master.week[wdIdx(d)]; if (!w) return null;
  const now = new Date(), out = [];
  for (let m = w[0]; m + dur() <= w[1]; m += 30) {
    const at = new Date(d); at.setMinutes(m);
    if (at - now < 60 * 60000) continue;
    let ok = true; for (let k = m; k < m + dur(); k += 30) if (busy(master.id, d, k)) ok = false;
    out.push({ m, ok });
  }
  return out;
}
function slots(d) {
  const ms = st.master === "any" ? MASTERS.filter(x => x.does.includes(st.service)) : MASTERS.filter(x => x.id === st.master);
  const all = ms.map(x => freeFor(x, d)).filter(Boolean);
  if (!all.length) return null;
  const map = new Map();
  for (const list of all) for (const s of list) map.set(s.m, (map.get(s.m) || false) || s.ok);
  return [...map].sort((a, b) => a[0] - b[0]).map(([m, ok]) => ({ m, ok }));
}

// ---------------------------------------------------------------- екрани
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) {
  if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); return n; };
const main = document.getElementById("main");

function viewService() {
  const groups = Object.keys(GROUPS);
  return [
    el("span", { class: "demo" }, t("demo")),
    el("h1", {}, t("s1")), el("p", { class: "sub" }, t("s1sub")),
    el("div", { class: "chips", role: "tablist" }, groups.map(g => el("button", { class: "chip", "aria-pressed": String(st.group === g),
      onclick: () => { st.group = g; render(); } }, GROUPS[g][st.lang]))),
    el("div", { class: "list" }, SERVICES.filter(s => s.g === st.group).map(s => el("button", { class: "svc", "aria-pressed": String(st.service === s.id),
      onclick: () => { st.service = s.id; st.time = null; if (st.master && st.master !== "any" && !MASTERS.find(x => x.id === st.master).does.includes(s.id)) st.master = null; render(); } },
      el("span", { class: "t" }, s.t[st.lang]), el("span", { class: "p" }, ft(s.price)),
      s.d[st.lang] ? el("span", { class: "d" }, s.d[st.lang]) : null,
      el("span", { class: "m" }, `⏱ ${s.dur} ${t("min")}`)))),
  ];
}
function viewMaster() {
  return [
    el("h1", {}, t("s2")), el("p", { class: "sub" }, t("s2sub")),
    el("div", { class: "masters" },
      el("button", { class: "mst", "aria-pressed": String(st.master === "any"), onclick: () => { st.master = "any"; st.time = null; render(); } },
        el("div", { class: "ava any" }, "✦"), el("b", {}, t("any")), el("small", {}, t("anyAbout"))),
      MASTERS.map(m => el("button", { class: "mst", "aria-pressed": String(st.master === m.id), disabled: !m.does.includes(st.service),
        onclick: () => { st.master = m.id; st.time = null; render(); } },
        el("div", { class: "ava" }, m.name[0]), el("b", {}, m.name), el("small", {}, m.about[st.lang])))),
  ];
}
function viewTime() {
  if (!st.day) st.day = DAYS.find(d => (slots(d) || []).some(s => s.ok)) || DAYS[0];
  const list = slots(st.day);
  const parts = [["morning", 0, 720], ["afternoon", 720, 1020], ["evening", 1020, 1440]];
  return [
    el("h1", {}, t("s3")), el("p", { class: "sub" }, t("s3sub")),
    el("div", { class: "days" }, DAYS.map((d, i) => { const s = slots(d); const open = s && s.some(x => x.ok);
      return el("button", { class: "day", disabled: !open, "aria-pressed": String(st.day.getTime() === d.getTime()),
        onclick: () => { st.day = d; st.time = null; render(); } },
        el("span", { class: "w" }, i === 0 ? t("today") : t("wd")[d.getDay()]), el("span", { class: "n" }, d.getDate()),
        el("span", { class: "mo" }, s ? t("mon")[d.getMonth()] : t("closed"))); })),
    list && list.some(s => s.ok)
      ? parts.map(([key, a, b]) => { const ps = list.filter(s => s.m >= a && s.m < b); return ps.length ? el("div", { class: "part" }, el("h3", {}, t(key)),
          el("div", { class: "slots" }, ps.map(s => el("button", { class: "slot", disabled: !s.ok, "aria-pressed": String(st.time === s.m),
            onclick: () => { st.time = s.m; render(); } }, hhmm(s.m))))) : null; })
      : el("div", { class: "empty" }, t("noSlots")),
  ];
}
function whenText() {
  const d = st.day; return `${t("wd")[d.getDay()]}, ${d.getDate()} ${t("mon")[d.getMonth()]} · ${hhmm(st.time)}`;
}
function masterName() { return st.master === "any" ? t("any") : MASTERS.find(m => m.id === st.master).name; }
function viewDetails() {
  const canWash = WASH.for.includes(st.service);
  return [
    el("h1", {}, t("s4")), el("p", { class: "sub" }, t("s4sub")),
    el("div", { class: "card" },
      el("div", { class: "row" }, el("span", {}, t("service")), el("span", {}, svc().t[st.lang] + (st.wash ? " + " + WASH.t[st.lang] : ""))),
      el("div", { class: "row" }, el("span", {}, t("master")), el("span", {}, masterName())),
      el("div", { class: "row" }, el("span", {}, t("when")), el("span", {}, whenText())),
      el("div", { class: "row" }, el("span", {}, t("duration")), el("span", {}, `${dur()} ${t("min")}`)),
      el("div", { class: "row total" }, el("span", {}, t("total")), el("span", {}, ft(price())))),
    canWash ? el("div", { class: "addon" }, el("div", {}, el("b", {}, `${WASH.t[st.lang]} · +${ft(WASH.price)}`), el("small", {}, WASH.d[st.lang])),
      el("button", { class: "switch", role: "switch", "aria-checked": String(st.wash), "aria-label": WASH.t[st.lang], onclick: () => { st.wash = !st.wash; render(); } })) : null,
    el("div", { class: "field" }, el("label", { for: "nm" }, t("name")),
      el("input", { id: "nm", autocomplete: "name", placeholder: t("namePh"), value: st.name, oninput: e => { st.name = e.target.value; syncCta(); } })),
    el("div", { class: "field" }, el("label", { for: "ph" }, t("phone")),
      el("input", { id: "ph", type: "tel", autocomplete: "tel", inputmode: "tel", value: st.phone, oninput: e => { st.phone = e.target.value; syncCta(); } }),
      el("span", { class: "hint" }, t("phoneHint"))),
    st.error ? el("p", { class: "err" }, st.error) : null,
  ];
}
function viewDone() {
  const b = st.done;
  return [el("section", { class: "done", style: "display:flex;flex-direction:column;gap:16px" },
    el("div", { class: "tick" }, el("svg", { width: 34, height: 34, viewBox: "0 0 24 24", fill: "none", stroke: "#f6dc97", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" },
      (() => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", "M5 12.5l4.5 4.5L19 7.5"); return p; })())),
    el("h1", {}, t("doneT")), el("p", { class: "sub", style: "margin:0" }, t("doneSub")),
    el("div", { class: "card" },
      el("div", { class: "row" }, el("span", {}, "#"), el("span", {}, b.id)),
      el("div", { class: "row" }, el("span", {}, t("service")), el("span", {}, b.service)),
      el("div", { class: "row" }, el("span", {}, t("master")), el("span", {}, b.master)),
      el("div", { class: "row" }, el("span", {}, t("when")), el("span", {}, b.when)),
      el("div", { class: "row total" }, el("span", {}, t("total")), el("span", {}, b.price))))];
}

// ---------------------------------------------------------------- навігація
const cta = document.getElementById("cta"), back = document.getElementById("back");
const ready = () => [!!st.service, !!st.master, st.time != null, true][st.step];
function syncCta() {
  if (st.done) { cta.disabled = false; cta.textContent = t("again"); return; }
  cta.disabled = !ready();
  if (st.step === 3) { cta.innerHTML = ""; cta.append(t("book"), el("small", {}, `${ft(price())} · ${dur()} ${t("min")}`)); }
  else cta.textContent = t("next");
}
function render() {
  document.documentElement.lang = st.lang;
  document.getElementById("tagline").textContent = t("tagline");
  const langs = document.getElementById("langs"); langs.replaceChildren(...Object.keys(T).map(l => el("button", { "aria-pressed": String(st.lang === l),
    onclick: () => { st.lang = l; try { localStorage.setItem("mo-lang", l); } catch (e) {} render(); } }, l.toUpperCase())));
  [...document.getElementById("rail").children].forEach((d, i) => d.classList.toggle("on", st.done ? true : i <= st.step));
  document.getElementById("stepTitle").textContent = st.done ? t("doneT") : t("steps")[st.step];
  document.getElementById("stepCount").textContent = st.done ? "" : `${st.step + 1} ${t("of")} 4`;
  back.hidden = st.step === 0 && !st.done || !!st.done;
  main.replaceChildren(...(st.done ? viewDone() : [viewService, viewMaster, viewTime, viewDetails][st.step]()));
  syncCta();
}
cta.addEventListener("click", () => {
  if (st.done) { Object.assign(st, { step: 0, service: null, master: null, day: null, time: null, wash: false, done: null }); render(); window.scrollTo(0, 0); return; }
  if (st.step < 3) { st.step++; render(); window.scrollTo(0, 0); return; }
  if (st.name.trim().length < 2 || st.phone.replace(/\D/g, "").length < 9) { st.error = t("needName"); render(); return; }
  st.error = "";
  st.done = { id: "MO-" + (1000 + hash(st.name + st.time) % 9000), service: svc().t[st.lang] + (st.wash ? " + " + WASH.t[st.lang] : ""),
    master: st.master === "any" ? (MASTERS.filter(m => m.does.includes(st.service))[0].name) : masterName(), when: whenText(), price: ft(price()) };
  render(); window.scrollTo(0, 0);
});
back.addEventListener("click", () => { if (st.step > 0) { st.step--; render(); window.scrollTo(0, 0); } });
render();
</script>
