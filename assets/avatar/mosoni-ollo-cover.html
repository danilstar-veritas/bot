<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#0b1120}svg{display:block}</style></head><body>
<!-- Обкладинка Facebook «Mosoni Olló Stúdió», 1640×624 (рендер ×2 = 3280×1248).
     Назва — угорі (y 60–140): на телефоні аватарка по центру накриває обкладинку вже від y ≈ 155.
     Центр (x 560–1080) нижче назви і весь низ порожні: там аватарка сторінки на телефоні й комп'ютері.
     Колонки — в межах x 270–1370: на телефоні видно лише центральні ~1110 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
<defs>
<radialGradient id="bg" cx="50%" cy="20%" r="85%"><stop offset="0" stop-color="#1f2c48"/><stop offset=".55" stop-color="#131c30"/><stop offset="1" stop-color="#080d18"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e3b04b" stop-opacity=".22"/><stop offset="1" stop-color="#e3b04b" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset=".28" stop-color="#f1cd73"/><stop offset=".55" stop-color="#d9a441"/><stop offset=".8" stop-color="#f0c96a"/><stop offset="1" stop-color="#a87726"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c9"/><stop offset=".45" stop-color="#ecc463"/><stop offset=".55" stop-color="#d59e3c"/><stop offset="1" stop-color="#b8862c"/></linearGradient>
<linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3b04b" stop-opacity="0"/><stop offset="1" stop-color="#e3b04b" stop-opacity=".85"/></linearGradient>
<linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3b04b" stop-opacity=".85"/><stop offset="1" stop-color="#e3b04b" stop-opacity="0"/></linearGradient>
<pattern id="pin" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="1" height="14" fill="#ffffff" opacity=".018"/></pattern>
<radialGradient id="vignette" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
<g id="half"><path d="M -14 0 C -14 -80 -7 -150 0 -205 C 5 -150 15 -80 14 0 Z"/><rect x="-9" y="0" width="18" height="100" rx="6"/><circle cx="0" cy="140" r="42" fill="none" stroke-width="17"/></g>
<path id="spark" d="M0 -26 C1.5 -9 9 -1.5 26 0 C9 1.5 1.5 9 0 26 C-1.5 9 -9 1.5 -26 0 C-9 -1.5 -1.5 -9 0 -26 Z"/>
<path id="diamond" d="M0 -6 L6 0 L0 6 L-6 0 Z"/>
</defs>

<!-- фон: глибокий синій, ледь помітна діагональна текстура, віньєтка -->
<rect width="1640" height="624" fill="url(#bg)"/>
<rect width="1640" height="624" fill="url(#pin)"/>
<rect width="1640" height="624" fill="url(#vignette)"/>
<!-- УГОРІ: назва (y 60–140) -->
<ellipse cx="820" cy="95" rx="330" ry="70" fill="url(#glow)"/>
<text x="820" y="110" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-size="68" font-weight="700"
      letter-spacing="5" fill="url(#goldV)">MOSONI OLLÓ</text>
<rect x="520" y="132" width="95" height="1.5" fill="url(#lineL)"/>
<rect x="1025" y="132" width="95" height="1.5" fill="url(#lineR)"/>
<text x="820" y="138" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15"
      font-weight="500" letter-spacing="6" fill="#efe2bf">STÚDIÓ · MOSONMAGYARÓVÁR</text>

<!-- ЛІВОРУЧ: ножиці (x 285–485, y 195–395) -->
<ellipse cx="385" cy="298" rx="150" ry="150" fill="url(#glow)"/>
<circle cx="385" cy="295" r="100" fill="none" stroke="#e3b04b" stroke-opacity=".38" stroke-width="2"/>
<circle cx="385" cy="295" r="91" fill="none" stroke="#e3b04b" stroke-opacity=".16" stroke-width="1"/>
<g transform="translate(385 300) scale(.4)" fill="url(#gold)" stroke="url(#gold)">
 <g transform="rotate(27)"><use href="#half"/></g>
 <g transform="rotate(-27)"><use href="#half"/></g>
 <circle r="13" fill="#0c1220" stroke="url(#gold)" stroke-width="6"/>
</g>
<use href="#spark" fill="#fff6dc" transform="translate(425 222) scale(.46)"/>
<use href="#spark" fill="#fff6dc" opacity=".75" transform="translate(347 229) scale(.27)"/>

<!-- ПРАВОРУЧ: послуги (x 1124–1345, y 200–400) -->
<g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" fill="#eef1f7">
 <text x="1124" y="214" font-size="14" letter-spacing="5" fill="#cdb98a">SZOLGÁLTATÁSOK</text>
 <rect x="1124" y="226" width="190" height="1.2" fill="url(#lineR)"/>
 <use href="#diamond" fill="#e3b04b" transform="translate(1131 255)"/>
 <text x="1147" y="263" font-size="22" font-weight="500">Férfi hajvágás</text>
 <use href="#diamond" fill="#e3b04b" transform="translate(1131 291)"/>
 <text x="1147" y="299" font-size="22" font-weight="500">Női hajvágás</text>
 <use href="#diamond" fill="#e3b04b" transform="translate(1131 327)"/>
 <text x="1147" y="335" font-size="22" font-weight="500">Gyerek hajvágás</text>
 <use href="#diamond" fill="#e3b04b" transform="translate(1131 363)"/>
 <text x="1147" y="371" font-size="22" font-weight="500">Szakállformázás</text>
 <text x="1124" y="398" font-size="15" letter-spacing="1.5" fill="#e3b04b" font-weight="600">ONLINE FOGLALÁS 24/7</text>
</g>
</svg>
</body></html>
